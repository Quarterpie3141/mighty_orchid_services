# Deploys the site (Next.js via Firebase Hosting web frameworks) and Cloud
# Functions to Firebase whenever commits land on master (including merged PRs).
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   GCP_SA_KEY         - service account JSON key for the Firebase project
#   MAILJET_API_KEY    - written to functions/.env at deploy time
#   MAILJET_SECRET_KEY
#   API_KEY

name: Deploy to Firebase

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_CLI_EXPERIMENTS: webframeworks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            functions/yarn.lock

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile
          yarn --cwd functions install --frozen-lockfile

      - name: Write functions/.env
        env:
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
          MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          cat > functions/.env <<EOF
          MAILJET_API_KEY=$MAILJET_API_KEY
          MAILJET_SECRET_KEY=$MAILJET_SECRET_KEY
          API_KEY=$API_KEY
          EOF

      # Key lives in RUNNER_TEMP (outside the repo) so it can't be bundled into the deploy
      - name: Deploy
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp-key.json"
          printf '%s' "$GCP_SA_KEY" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@15 deploy --project mightyorchidservices --non-interactive --force
